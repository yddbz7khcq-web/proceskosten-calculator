<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proceskosten Calculator – Civiel</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="card">
    <h1>Proceskosten Calculator</h1>
    <p class="sub">Indicatie van proceskosten. Rechter kan afwijken.</p>

    <label for="tariefset">Tarieven</label>
    <select id="tariefset">
      <option value="2026" selected>2026</option>
    </select>

    <label for="gerecht">Gerecht</label>
    <select id="gerecht">
      <option value="rechtbank_civiel" selected>Rechtbank (civiel)</option>
      <option value="kanton">Kanton</option>
      <option value="hof">Gerechtshof (hoger beroep)</option>
    </select>

    <label for="procedure">Procedure</label>
    <select id="procedure">
      <option value="bodem" selected>Bodemprocedure</option>
      <option value="kg">Kort geding</option>
    </select>

    <!-- KANTON EXTRA -->
    <div id="kantonExtra" style="display:none;">
      <label for="kantonSoort">Kanton: soort zaak</label>
      <select id="kantonSoort">
        <option value="geld" selected>Geldvordering (staffel)</option>
        <option value="onbepaald">Onbepaalde waarde (range)</option>
        <option value="ontruiming">Ontruiming</option>
        <option value="overig">Overige verzoeken</option>
      </select>

      <label for="onbepaaldNiveau">Onbepaalde waarde: niveau (alleen voor indicatie)</label>
      <select id="onbepaaldNiveau">
        <option value="laag">Laag (min)</option>
        <option value="gemiddeld" selected>Gemiddeld</option>
        <option value="hoog">Hoog (max)</option>
      </select>
    </div>

    <!-- HOF EXTRA -->
    <div id="hofExtra" style="display:none;">
      <hr class="sep" />
      <h2>Hof (extra)</h2>

      <div class="row">
        <label class="check">
          <input type="checkbox" id="incidenteel" />
          Incidenteel appel meenemen (indicatie)
        </label>
      </div>

      <div class="row">
        <label class="check">
          <input type="checkbox" id="incidenteelNoodzakelijk" />
          Incidenteel: noodzakelijk geoordeeld (anders €0)
        </label>
      </div>

      <p class="hint">
        Bij incidenteel appel wordt indicatief ½ van het salaris in principaal gehanteerd, mits noodzakelijk geoordeeld.
      </p>
    </div>

    <!-- KORT GEDING EXTRA -->
    <div id="kgExtra" style="display:none;">
      <hr class="sep" />
      <h2>Kort geding (extra)</h2>

      <label for="kgType">KG: wijze van afdoening</label>
      <select id="kgType">
        <option value="contradictoir" selected>Contradictoir</option>
        <option value="verstek">Verstek</option>
      </select>

      <label for="kgComplex">KG: complexiteit</label>
      <select id="kgComplex">
        <option value="eenvoudig">Eenvoud
